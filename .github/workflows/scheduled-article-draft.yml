name: Scheduled Article Draft

on:
  schedule:
    - cron: "15 2 * * 1,3,5"
  workflow_dispatch:
    inputs:
      topic_id:
        description: "Optional topic ID from automation/topics.json"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: teknopraktis-scheduled-article
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      TOPIC_ID: ${{ inputs.topic_id }}

    steps:
      - name: Check automation configuration
        id: config
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY belum dikonfigurasi; scheduled generation dilewati." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.config.outputs.enabled == 'true'
        run: npm install --no-audit --no-fund

      - name: Generate researched draft
        if: steps.config.outputs.enabled == 'true'
        run: node scripts/generate-scheduled-article.mjs

      - name: Validate repository
        if: steps.config.outputs.enabled == 'true'
        run: |
          npm run quality
          npm run build

      - name: Commit draft to main
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Tidak ada perubahan untuk disimpan." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "teknopraktis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/topics.json src/content/articles/
          git commit -m "content: generate scheduled editorial draft"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Draft baru tersimpan di main sebagai draft:true dan belum dipublikasikan." >> "$GITHUB_STEP_SUMMARY"
