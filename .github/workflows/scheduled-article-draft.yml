name: Scheduled Article Draft

on:
  schedule:
    - cron: "15 2 * * 1,3,5"
  workflow_dispatch:
    inputs:
      topic_id:
        description: "Optional topic ID from automation/topics.json"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: teknopraktis-scheduled-article
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_DRAFT_MODEL: ${{ vars.OPENAI_DRAFT_MODEL }}
      OPENAI_EDITOR_MODEL: ${{ vars.OPENAI_EDITOR_MODEL }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
      TOPIC_ID: ${{ inputs.topic_id }}
      AUTO_PUBLISH_UNTIL: "20"
      CONTENT_GENERATION_PAUSED: "true"

    steps:
      - name: Check automation configuration
        id: config
        shell: bash
        run: |
          if [ "$CONTENT_GENERATION_PAUSED" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CONTENT GENERATION PAUSED — UI/thumbnail remediation belum selesai." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY belum dikonfigurasi; scheduled generation dilewati." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.config.outputs.enabled == 'true'
        run: npm install --no-audit --no-fund

      - name: Install image compositor
        if: steps.config.outputs.enabled == 'true'
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Generate Luna draft + Sol editorial review
        if: steps.config.outputs.enabled == 'true'
        run: node scripts/generate-scheduled-article.mjs

      - name: Validate repository
        if: steps.config.outputs.enabled == 'true'
        run: |
          npm run quality
          npm run build

      - name: Commit editorial result to main
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Tidak ada perubahan untuk disimpan." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "teknopraktis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/topics.json src/content/articles/ public/images/articles/
          git commit -m "content: run scheduled editorial pipeline"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Pipeline selesai. Selama total artikel terbit < 20, artikel yang lolos semua gate dipublikasikan otomatis. Setelah target 20 tercapai, pipeline kembali menyimpan artikel sebagai draft." >> "$GITHUB_STEP_SUMMARY"
