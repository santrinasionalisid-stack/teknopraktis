name: Publish Approved Article

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Article slug to publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: teknopraktis-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTICLE_SLUG: ${{ inputs.slug }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Mark article approved for publication
        run: node scripts/publish-article.mjs

      - name: Full quality and production build
        run: |
          npm run quality
          npm run build

      - name: Commit publication
        shell: bash
        run: |
          git config user.name "teknopraktis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/topics.json src/content/articles/
          git commit -m "content: publish approved article $ARTICLE_SLUG"
          git pull --rebase origin main
          git push origin HEAD:main
