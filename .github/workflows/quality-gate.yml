name: Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Automation script syntax
        run: |
          node --check scripts/generate-scheduled-article.mjs
          node --check scripts/editorial-image.mjs
          node --check scripts/content-quality.mjs

      - name: Editorial quality gate
        run: npm run quality

      - name: Production build
        run: npm run build
